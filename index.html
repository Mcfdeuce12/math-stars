<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Stars</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Math Stars"><meta name="theme-color" content="#6c4cf1">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2350;--mute:#6b6590;--pri:#6c4cf1;--ok:#22a06b;--bad:#e5484d;--key:#eee9ff;--line:#d9d0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17142b;--card:#232042;--ink:#f1eeff;--mute:#a9a3d1;--key:#2f2b57;--line:#453f7a}}
:root[data-theme="dark"]{--bg:#17142b;--card:#232042;--ink:#f1eeff;--mute:#a9a3d1;--key:#2f2b57;--line:#453f7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:manipulation;user-select:none}
.app{max-width:520px;margin:0 auto;padding:14px}
.screen{display:none}.screen.on{display:block}
h1{font-size:34px;margin:6px 0;text-align:center}h2{margin:8px 0}
.sub{text-align:center;color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(80,60,160,.12)}
label.t{font-weight:700;display:block;margin:2px 0 8px}
input[type=text]{width:100%;font-size:22px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:70px;padding:12px 8px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer}
.chip.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.btn{width:100%;padding:16px;border:0;border-radius:16px;background:var(--pri);color:#fff;font-size:22px;font-weight:800;cursor:pointer;margin-top:8px}
.btn.alt{background:var(--key);color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px}
.bar{height:10px;border-radius:6px;background:var(--key);margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.prob{background:var(--card);border-radius:20px;padding:14px;min-height:190px;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;margin:8px 0;transition:background .2s}
.prob.good{background:#c9f5df;color:#0b5b3a}.prob.bad{background:#ffd8d9;color:#8a1c20;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.stk{display:inline-block;text-align:right;font-variant-numeric:tabular-nums}
.stk .r{padding:0 10px}.stk .op{float:left;margin-right:14px}
.stk .ln{border-top:5px solid var(--ink);margin:4px 0}
.ans{display:inline-block;min-width:1.6em;border-bottom:4px dashed var(--pri);text-align:center;padding:0 8px}
.side .ans{margin-left:8px}
.fb{text-align:center;min-height:28px;font-weight:800;font-size:20px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k{padding:0;height:64px;border:0;border-radius:16px;background:var(--key);color:var(--ink);font-size:30px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.k:active{transform:translateY(3px);box-shadow:none}
.k.del{background:#ffe3b8;color:#6b3d00}.k.ent{background:var(--ok);color:#fff;box-shadow:0 3px 0 #17744d;font-size:22px}
.stars{font-size:46px;text-align:center}
.big{font-size:20px;text-align:center;margin:4px 0}
table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mute);font-size:13px}
tr.me td{background:var(--key);font-weight:800}
.mute{position:fixed;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:22px;cursor:pointer}
.small{color:var(--mute);font-size:13px;text-align:center}
.stk .ans{min-width:1ch;padding:0;text-align:right}
.pen{background:var(--card);border:3px dashed var(--line);border-radius:20px;min-height:120px;padding:8px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:flex-start;margin:8px 0}
.bank{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.an{font-size:38px;line-height:1;border:0;background:transparent;cursor:pointer;padding:4px}
.an.add{background:var(--key);border-radius:16px;padding:8px 12px;box-shadow:0 3px 0 var(--line)}
</style></head><body>
<div class="app">

<section class="screen on" id="home">
 <h1>⭐ Math Stars ⭐</h1><p class="sub">Practice math, beat the clock, climb the leaderboard!</p>
 <div class="card"><label class="t">What's your name?</label><input type="text" id="name" maxlength="14" placeholder="Type your name" autocomplete="off"></div>
 <div class="card"><label class="t">Grade</label><div class="chips" id="gradeChips"></div></div>
 <div class="card"><label class="t">Number of questions</label><div class="chips" id="countChips"></div></div>
 <button class="btn" id="start">Let's Play! ▶</button>
 <button class="btn alt" id="toLb">🏆 Leaderboards</button>
 <button class="btn alt" id="toProg">📊 My Progress</button>
 <div class="card" id="mine" style="display:none"></div>
</section>

<section class="screen" id="game">
 <div class="top"><span id="gq">1/10</span><span id="gt">0:00.0</span><span id="gs">✅ 0</span></div>
 <div class="bar"><i id="gbar"></i></div>
 <div class="prob" id="prob"></div>
 <div class="fb" id="fb"></div>
 <div class="pad" id="pad"></div>
 <div id="animals" style="display:none"><p class="small">Tap an animal in the pen to send it away. Tap an animal below to add one!</p><div class="pen" id="pen"></div><div class="bank" id="bank"></div><p class="big">In the pen: <b id="cnt">0</b></p><button class="btn" id="chk">Check ✓</button></div>
 <button class="btn alt" id="quit" style="font-size:16px;padding:10px">Quit</button>
</section>

<section class="screen" id="result">
 <h1 id="rTitle">Great job!</h1>
 <div class="stars" id="rStars"></div>
 <div class="card">
  <p class="big" id="rScore"></p><p class="big" id="rAcc"></p><p class="big" id="rTime"></p><p class="big" id="rRank"></p>
 </div>
 <button class="btn" id="again">Play Again 🔁</button>
 <button class="btn alt" id="rLb">🏆 Leaderboards</button>
 <button class="btn alt" id="rProg">📊 My Progress</button>
 <button class="btn alt" id="rHome">Menu</button>
</section>

<section class="screen" id="lb">
 <h2>🏆 Leaderboards</h2>
 <div class="card"><label class="t">Grade</label><div class="chips" id="lbGrade"></div>
  <label class="t" style="margin-top:12px">Questions</label><div class="chips" id="lbCount"></div>
  <label class="t" style="margin-top:12px">Ranked by</label><div class="chips" id="lbMode"></div></div>
 <div class="card" id="lbTable"></div>
 <p class="small" id="lbNote"></p>
 <button class="btn alt" id="lbBack">← Back</button>
</section>

<section class="screen" id="prog">
 <h2>📊 My Progress</h2>
 <div class="card"><label class="t">Player</label><div class="chips" id="progChips"></div></div>
 <div id="progBody"></div>
 <button class="btn alt" id="progBack">← Back</button>
</section>
</div>
<button class="mute" id="mute" aria-label="Sound">🔊</button>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var GRADES=[0,1,2,3,'A'],COUNTS=[5,10,15,20];
var store={};
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return store[k]!==undefined?store[k]:d}}
function save(k,v){store[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function fmt(s){var m=Math.floor(s/60);return m+':'+(s-m*60).toFixed(1).padStart(4,'0')}
var S={name:load('ms_name',''),grade:load('ms_grade',1),count:load('ms_count',10),muted:load('ms_mute',false)};
var runs=load('ms_runs',[]);
var col=null,synced=false;
function refreshViews(){var a=document.querySelector('.screen.on');if(!a)return;if(a.id==='lb')drawLb();else if(a.id==='prog')drawProg();else if(a.id==='home')mine()}
if(window.claude&&window.claude.use){window.claude.use('db').then(function(db){
 if(!db)return;
 col=db.collection('runs');
 col.orderBy('date','desc').limit(1000).onSnapshot(function(s){
  var a=s.docs.map(function(d){return d.data()}),seen={};
  a.forEach(function(r){seen[r.date+r.name]=1});
  load('ms_runs',[]).forEach(function(r){if(!seen[r.date+r.name]){a.push(r);if(!synced)col.add(r).catch(function(){})}});
  synced=true;runs=a;refreshViews();
 },function(){});
}).catch(function(){})}

/* ---------- sound ---------- */
var AC;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,d,type,vol){var a=ac();if(!a||S.muted)return;var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;var t=a.currentTime+t0;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function yay(){tone(523,0,.15);tone(659,.1,.15);tone(784,.2,.25)}
function oops(){tone(220,0,.25,'sawtooth',.18);tone(165,.18,.35,'sawtooth',.18)}
function fanfare(){[523,659,784,1047,784,1047].forEach(function(f,i){tone(f,i*.13,.25,'triangle',.28)})}
function click(){tone(700,0,.05,'square',.06)}
$('mute').onclick=function(){S.muted=!S.muted;save('ms_mute',S.muted);$('mute').textContent=S.muted?'🔇':'🔊';ac()};
$('mute').textContent=S.muted?'🔇':'🔊';

/* ---------- screens ---------- */
function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on')});$(id).classList.add('on');window.scrollTo(0,0);if(id==='home')mine()}
function chips(el,vals,cur,label,cb){el.innerHTML='';vals.forEach(function(v){var b=document.createElement('button');b.className='chip'+(v===cur?' sel':'');b.textContent=label(v);b.onclick=function(){click();cb(v);chips(el,vals,v,label,cb)};el.appendChild(b)})}
var gl=function(g){return g===0?'Starter ➕':g==='A'?'🦊 Animals':g===1?'1st Grade':g===2?'2nd Grade':'3rd Grade'};
chips($('gradeChips'),GRADES,S.grade,gl,function(v){S.grade=v;save('ms_grade',v)});
chips($('countChips'),COUNTS,S.count,function(c){return c},function(v){S.count=v;save('ms_count',v)});
$('name').value=S.name;

function mine(){
 var n=S.name.trim().toLowerCase(),el=$('mine');
 var r=runs.filter(function(x){return x.name.toLowerCase()===n});
 if(!n||!r.length){el.style.display='none';return}
 el.style.display='block';
 var h='<label class="t">⏱ '+esc(S.name)+'\'s best by level</label><table><tr><th>Level</th><th>Best score</th><th>Best time</th></tr>';
 GRADES.forEach(function(g){var x=r.filter(function(q){return q.grade===g});if(!x.length)return;
  var bs=Math.max.apply(null,x.map(function(q){return Math.round(q.correct/q.total*100)}));
  var bt=Math.min.apply(null,x.map(function(q){return q.time}));
  h+='<tr><td>'+gl(g)+'</td><td>'+bs+'%</td><td>'+fmt(bt)+'</td></tr>'});
 el.innerHTML=h+'</table>';
}

/* ---------- problems ---------- */
function gen(g){
 var a,b,op,ans,stack=Math.random()<.55;
 if(g===0||g==='A'){
  var s;
  if(g===0||Math.random()<.5){s=rnd(2,10);a=rnd(1,s-1);b=s-a;return {a:a,b:b,op:'+',ans:s,stack:g==='A'?false:stack}}
  a=rnd(2,10);b=rnd(1,a-1);return {a:a,b:b,op:'−',ans:a-b,stack:false};
 }
 if(g===1){
  if(Math.random()<.55){var s=rnd(2,20);a=rnd(1,s-1);b=s-a;op='+';ans=s}
  else{a=rnd(2,20);b=rnd(1,a);op='−';ans=a-b}
 }else if(g===2){
  var big=Math.random()<.8;
  if(Math.random()<.5){a=big?rnd(10,89):rnd(1,9)+rnd(0,1)*10;b=rnd(big?10:1,Math.min(99,99-0));op='+';ans=a+b}
  else{a=rnd(20,99);b=rnd(big?10:1,a);op='−';ans=a-b}
 }else{
  var r=Math.random();
  if(r<.25){a=rnd(100,600);b=rnd(100,399);op='+';ans=a+b}
  else if(r<.45){a=rnd(200,999);b=rnd(100,a);op='−';ans=a-b}
  else if(r<.75){a=rnd(2,10);b=rnd(2,10);op='×';ans=a*b}
  else{b=rnd(2,10);ans=rnd(2,10);a=b*ans;op='÷';stack=false}
 }
 return {a:a,b:b,op:op,ans:ans,stack:stack};
}
function render(p){
 $('prob').innerHTML=p.stack
  ?'<div class="stk"><div class="r">'+p.a+'</div><div class="r"><span class="op">'+p.op+'</span>'+p.b+'</div><div class="ln"></div><div class="r"><span class="ans" id="ans">?</span></div></div>'
  :'<div class="side">'+p.a+' '+p.op+' '+p.b+' = <span class="ans" id="ans">?</span></div>';
}

/* ---------- game ---------- */
var G=null,tick=null;
function start(){
 ac();
 var nm=$('name').value.trim();
 if(!nm){$('name').focus();$('name').style.borderColor='var(--bad)';return}
 S.name=nm;save('ms_name',nm);$('name').style.borderColor='';
 G={qs:[],i:0,input:'',correct:0,locked:false,t0:performance.now(),log:[],qt:0,pen:[]};
 for(var i=0;i<S.count;i++)G.qs.push(gen(S.grade));
 show('game');next(true);
 clearInterval(tick);tick=setInterval(function(){$('gt').textContent=fmt((performance.now()-G.t0)/1000)},100);
}
function next(first){
 if(!first)G.i++;
 if(G.i>=G.qs.length)return finish();
 G.input='';G.locked=false;$('fb').textContent='';G.qt=performance.now();
 var an=S.grade==='A';$('pad').style.display=an?'none':'';$('animals').style.display=an?'block':'none';
 $('prob').className='prob';render(G.qs[G.i]);if(an)initPen();
 $('gq').textContent=(G.i+1)+'/'+G.qs.length;$('gs').textContent='✅ '+G.correct;
 $('gbar').style.width=(G.i/G.qs.length*100)+'%';
}
function setAns(){var a=$('ans');if(a)a.textContent=G.input===''?'?':G.input}
function press(k){
 if(!G||G.locked)return;if(S.grade==='A'&&k!=='ent')return;
 if(k==='del'){G.input=G.input.slice(0,-1);click();setAns();return}
 if(k==='ent'){
  if(G.input==='')return;
  G.locked=true;var p=G.qs[G.i],ok=parseInt(G.input,10)===p.ans;
  G.log.push({a:p.a,b:p.b,op:p.op,ok:ok,t:Math.round((performance.now()-G.qt)/100)/10,st:p.stack?1:0,g:S.grade});
  if(ok){G.correct++;yay();$('prob').classList.add('good');$('fb').textContent=['Great!','Awesome!','You got it!','Super!','Nice one!'][rnd(0,4)]+' 🌟';$('fb').style.color='var(--ok)'}
  else{oops();$('prob').classList.add('bad');$('fb').textContent='Not quite — the answer is '+p.ans;$('fb').style.color='var(--bad)'}
  $('gs').textContent='✅ '+G.correct;
  setTimeout(function(){next()},ok?900:1700);return;
 }
 if(G.input.length>=4)return;
 if(G.input==='0')G.input='';
 G.input+=k;click();setAns();
}
var ANI=['🦊','🦝','🐻','🐰','🐼','🐸','🐱','🐶','🦁','🐨'];
function drawPen(){
 var pen=$('pen');pen.innerHTML='';
 G.pen.forEach(function(e,i){var b=document.createElement('button');b.className='an';b.textContent=e;b.onclick=function(){if(G.locked)return;G.pen.splice(i,1);click();drawPen()};pen.appendChild(b)});
 if(!G.pen.length)pen.innerHTML='<span class="small">The pen is empty</span>';
 G.input=String(G.pen.length);setAns();$('cnt').textContent=G.pen.length;
}
function initPen(){var p=G.qs[G.i],e=ANI[rnd(0,ANI.length-1)];G.pen=[];for(var i=0;i<p.a;i++)G.pen.push(e);drawPen()}
(function(){var bk=$('bank');ANI.slice(0,6).forEach(function(e){var b=document.createElement('button');b.className='an add';b.textContent=e;b.addEventListener('pointerdown',function(ev){ev.preventDefault();if(!G||G.locked||G.pen.length>=15)return;G.pen.push(e);click();drawPen()});bk.appendChild(b)});
 $('chk').addEventListener('pointerdown',function(ev){ev.preventDefault();press('ent')})})();
(function(){var p=$('pad');['7','8','9','4','5','6','1','2','3','del','0','ent'].forEach(function(k){
 var b=document.createElement('button');b.className='k'+(k==='del'?' del':k==='ent'?' ent':'');
 b.textContent=k==='del'?'⌫':k==='ent'?'Enter ✓':k;
 b.addEventListener('pointerdown',function(e){e.preventDefault();press(k)});p.appendChild(b)})})();
document.addEventListener('keydown',function(e){
 if(!$('game').classList.contains('on'))return;
 if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('del');else if(e.key==='Enter')press('ent');
});

function finish(){
 clearInterval(tick);
 var time=(performance.now()-G.t0)/1000,acc=Math.round(G.correct/G.qs.length*100);
 var run={name:S.name,grade:S.grade,count:S.count,correct:G.correct,total:G.qs.length,time:time,date:Date.now(),log:G.log};
 runs.push(run);save('ms_runs',runs);if(col)col.add(run).catch(function(){});
 $('gbar').style.width='100%';
 var st=acc>=90?3:acc>=70?2:1;
 $('rStars').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);
 $('rTitle').textContent=acc===100?'Perfect! 🎉':acc>=70?'Great job, '+S.name+'!':'Keep practicing, '+S.name+'!';
 $('rScore').textContent='Score: '+G.correct+' / '+G.qs.length;
 $('rAcc').textContent='Accuracy: '+acc+'%';
 $('rTime').textContent='Time: '+fmt(time);
 var fr=board(S.grade,S.count,'fast'),ar=board(S.grade,S.count,'acc'),msg=[];
 var fi=fr.findIndex(function(x){return x===run}),ai=ar.findIndex(function(x){return x===run});
 if(fi>=0)msg.push('⚡ Fastest rank #'+(fi+1));
 if(ai>=0)msg.push('🎯 Accuracy rank #'+(ai+1));
 $('rRank').textContent=msg.join('  •  ');
 show('result');fanfare();
}
$('start').onclick=start;
$('again').onclick=start;
$('quit').onclick=function(){clearInterval(tick);G=null;show('home')};
$('rHome').onclick=function(){show('home')};

/* ---------- leaderboards ---------- */
var L={g:1,c:10,m:'fast'};
function board(g,c,mode){
 var best={};
 runs.forEach(function(r){
  if(r.grade!==g||r.count!==c)return;
  var acc=r.correct/r.total;
  var k=r.name.toLowerCase(),o=best[k];
  var better=!o||(mode==='fast'?(r.time+5*(r.total-r.correct))<(o.time+5*(o.total-o.correct)):(acc>o.correct/o.total||(acc===o.correct/o.total&&r.time<o.time)));
  if(better)best[k]=r;
 });
 return Object.keys(best).map(function(k){return best[k]}).sort(function(a,b){
  var aa=a.correct/a.total,bb=b.correct/b.total;
  return mode==='fast'?(a.time+5*(a.total-a.correct))-(b.time+5*(b.total-b.correct)):(bb-aa||a.time-b.time);
 }).slice(0,10);
}
function drawLb(){
 chips($('lbGrade'),GRADES,L.g,function(g){return gl(g)},function(v){L.g=v;drawLb()});
 chips($('lbCount'),COUNTS,L.c,function(c){return c},function(v){L.c=v;drawLb()});
 chips($('lbMode'),['fast','acc'],L.m,function(m){return m==='fast'?'⚡ Fastest':'🎯 Most Accurate'},function(v){L.m=v;drawLb()});
 var rows=board(L.g,L.c,L.m),me=S.name.trim().toLowerCase();
 var h='<table><tr><th>#</th><th>Player</th><th>Score</th><th>Time</th></tr>';
 while(rows.length<10)rows.push(null);
 rows.forEach(function(r,i){if(!r){h+='<tr><td>'+(i+1)+'</td><td colspan="3" style="color:var(--mute)">— open spot —</td></tr>';return}
  var medal=i===0?'👑':i===1?'🥈':i===2?'🥉':(i+1);
  h+='<tr class="'+(r.name.toLowerCase()===me?'me':'')+'"><td>'+medal+'</td><td>'+esc(r.name)+'</td><td>'+Math.round(r.correct/r.total*100)+'%</td><td>'+fmt(L.m==='fast'?r.time+5*(r.total-r.correct):r.time)+'</td></tr>'});
 $('lbTable').innerHTML=h+'</table>';
 $('lbNote').textContent=(L.m==='fast'?'Fastest = your time plus 5 seconds for each miss.':'Most Accurate ranks by percent correct, then by time.')+(col?' ☁️ Saved online.':' 📱 Saved on this device only.');
}
function openLb(){L.g=S.grade;L.c=S.count;drawLb();show('lb')}
$('toLb').onclick=openLb;

/* ---------- progress ---------- */
var P={n:''};
var OPS=[['+','Addition'],['−','Subtraction'],['×','Multiplication'],['÷','Division']];
function pc(a){return a.length?Math.round(a.filter(function(q){return q.ok}).length/a.length*100)+'% ('+a.length+')':'—'}
function drawProg(){
 var names=[];runs.forEach(function(r){if(names.indexOf(r.name)<0)names.push(r.name)});
 var el=$('progBody');
 if(!names.length){$('progChips').innerHTML='';el.innerHTML='<div class="card"><p class="small">Play a game first and progress will show up here!</p></div>';return}
 if(names.indexOf(P.n)<0)P.n=names[0];
 chips($('progChips'),names,P.n,function(n){return n},function(v){P.n=v;drawProg()});
 var lg=[];runs.forEach(function(r){if(r.name===P.n&&r.log)lg=lg.concat(r.log)});
 if(!lg.length){el.innerHTML='<div class="card"><p class="small">Play a new game to start collecting skill details!</p></div>';return}
 var h='<div class="card"><p class="big">'+lg.length+' questions answered • '+pc(lg).split(' ')[0]+' correct</p></div>';
 h+='<div class="card"><label class="t">By skill</label><table><tr><th>Skill</th><th>Tried</th><th>Right</th><th>Avg time</th><th></th></tr>';
 OPS.forEach(function(o){var x=lg.filter(function(q){return q.op===o[0]});if(!x.length)return;
  var ok=x.filter(function(q){return q.ok}).length,acc=Math.round(ok/x.length*100),avg=x.reduce(function(s,q){return s+q.t},0)/x.length;
  h+='<tr><td>'+o[0]+' '+o[1]+'</td><td>'+x.length+'</td><td>'+acc+'%</td><td>'+avg.toFixed(1)+'s</td><td>'+(acc>=90&&avg<=8?'💪':acc<70?'📚':'👍')+'</td></tr>'});
 h+='</table><p class="small">💪 strong • 👍 doing fine • 📚 needs practice</p></div>';
 h+='<div class="card"><label class="t">By layout</label><p class="big">Stacked: '+pc(lg.filter(function(q){return q.st}))+'<br>Side by  side: '+pc(lg.filter(function(q){return !q.st}))+'</p></div>';
 var m={};lg.forEach(function(q){var k=q.a+' '+q.op+' '+q.b,o=m[k]||(m[k]={k:k,n:0,w:0});o.n++;if(!q.ok)o.w++});
 var tr=Object.keys(m).map(function(k){return m[k]}).filter(function(o){return o.w}).sort(function(a,b){return b.w-a.w||b.n-a.n}).slice(0,6);
 h+='<div class="card"><label class="t">Trouble spots</label>'+(tr.length?'<table>'+tr.map(function(o){return '<tr><td>'+o.k+'</td><td>missed '+o.w+' of '+o.n+'</td></tr>'}).join('')+'</table>':'<p class="small">No misses yet — amazing! 🌟</p>')+'</div>';
 var rr=runs.filter(function(r){return r.name===P.n}).slice(-5).reverse();
 h+='<div class="card"><label class="t">Recent games</label><table>'+rr.map(function(r){return '<tr><td>'+gl(r.grade)+'</td><td>'+r.correct+'/'+r.total+'</td><td>'+fmt(r.time)+'</td></tr>'}).join('')+'</table></div>';
 el.innerHTML=h;
}
function openProg(){P.n=S.name;drawProg();show('prog')}
$('toProg').onclick=openProg;$('rProg').onclick=openProg;$('progBack').onclick=function(){show('home')};$('rLb').onclick=openLb;$('lbBack').onclick=function(){show('home')};
mine();
})();
</script>
